name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so integration tests are reproducible; bump deliberately.
  MIHOMO_VERSION: v1.19.34

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "未格式化的文件:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Download mihomo for integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MIHOMO_VERSION" -R MetaCubeX/mihomo \
            --pattern "mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" -O mihomo.gz
          gunzip mihomo.gz && chmod +x mihomo && ./mihomo -v
          echo "TLASH_MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: go test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile (lite builds UPX-compressed)
        run: UPX_BIN="$(scripts/fetch-upx.sh)" scripts/build-release.sh "0.0.0-ci+${GITHUB_SHA::7}"
      - name: Run every build under qemu-user
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          scripts/smoke-test-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tlash-binaries
          path: dist/*

  openwrt:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENWRT_IMAGE: openwrt/rootfs:x86-64-openwrt-24.10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: dnsmasq / firewall changes round-trip on real uci
        run: |
          CGO_ENABLED=0 go test -c -o owrt/gatewaysys.test ./internal/gatewaysys/
          for pre in "" 'uci add_list dhcp.@dnsmasq[0].server=/corp.example/10.0.0.1; uci add_list dhcp.@dnsmasq[0].server=223.5.5.5; uci set dhcp.@dnsmasq[0].noresolv=0; uci commit dhcp;'; do
            docker run --rm -v "$PWD/owrt:/t:ro" -e TLASH_TEST_REAL_UCI=1 "$OPENWRT_IMAGE" \
              sh -c "mkdir -p /var/lock; $pre /t/gatewaysys.test -test.run TestRealUCIRoundTrip -test.v"
          done

      - name: Install and uninstall on OpenWrt
        run: |
          scripts/build-release.sh v0.0.0-ci
          (cd dist && python3 -m http.server 18766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          docker run --rm --network host -v "$PWD/scripts/install.sh:/install.sh:ro" "$OPENWRT_IMAGE" sh -ec '
            mkdir -p /var/lock
            version=v0.0.0-ci base_url=http://127.0.0.1:18766 sh /install.sh
            test "$(command -v tlash)" = /usr/bin/tlash
            tlash version
            tlash gateway check || true
            sh /install.sh purge
            ! test -e /usr/bin/tlash
            ! test -e /etc/tlash'
