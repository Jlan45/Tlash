name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Cross-compile (lite builds UPX-compressed)
        run: UPX_BIN="$(scripts/fetch-upx.sh)" scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Run every build under qemu-user
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          scripts/smoke-test-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag $prerelease
